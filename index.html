<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/header.css" />
    <link rel="stylesheet" href="CSS/hero.css" />
    <link rel="stylesheet" href="CSS/grid.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li>
            <a href="#"
              ><img src="images/apple-logo.png" alt="Apple" class="apple-logo"
            /></a>
          </li>
          <li><a href="#">Store</a></li>
          <li><a href="#">Mac</a></li>
          <li><a href="#">iPad</a></li>
          <li><a href="#">iPhone</a></li>
          <li><a href="#">Watch</a></li>
          <li><a href="#">Vision</a></li>
          <li><a href="#">AirPods</a></li>
          <li><a href="#">TV & Home</a></li>
          <li><a href="#">Entertainment</a></li>
          <li><a href="#">Accessories</a></li>
          <li><a href="#">Support</a></li>
          <li>
            <a href="#"
              ><img src="images/search.png" alt="search" class="header-icon"
            /></a>
          </li>
          <li>
            <a href="#"
              ><img src="images/cart.png" alt="cart" class="header-icon"
            /></a>
          </li>
        </ul>
      </nav>
    </header>
    <section
      class="hero"
      style="
        background-image: url(&quot;images/hero_iphone_17_pro__background.jpg&quot;);
      "
    >
      <div class="tile-content">
        <div class="tile-wrapper">
          <h2 class="heroMainTitle" style="color: white">iPhone 17 Pro</h2>
          <p class="heroSubTitle" style="color: white">All out Pro.</p>
        </div>
        <div class="heroBtn">
          <button class="LearnMoreBtn">Learn more</button>
          <button class="BuyBtn">Buy</button>
        </div>
      </div>
    </section>

    <section
      class="hero"
      style="
        background-image: url(&quot;images/hero_macbook_air_background.jpg&quot;);
      "
    >
      <div class="tile-content">
        <div class="tile-wrapper">
          <h2 class="heroMainTitle">MacBook Air</h2>
          <p class="heroSubTitle">Now supercharged by M5.</p>
        </div>
        <div class="heroBtn">
          <button class="LearnMoreBtn">Learn more</button>
          <button class="BuyBtn">Buy</button>
        </div>
      </div>
    </section>

    <section
      class="hero"
      style="
        background-image: url(&quot;images/hero_iphone_17__background.jpg&quot;);
      "
    >
      <div class="tile-content">
        <div class="tile-wrapper">
          <h2 class="heroMainTitle">iPhone 17</h2>
          <p class="heroSubTitle">Magichromatic.</p>
        </div>
        <div class="heroBtn">
          <button class="LearnMoreBtn">Learn more</button>
          <button class="BuyBtn">Buy</button>
        </div>
      </div>
    </section>
    <section class="grid">
      <div></div>
    </section>
    <script src="JS/header.js"></script>
    <script src="JS/hero.js"></script>
    <script src="JS/grid.js"></script>
  </body>
</html>
